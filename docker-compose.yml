# Dev local : API + worker + Postgres + Redis
services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    depends_on: [postgres, redis]
  worker:
    build: .
    command: python -m jarvis_os.jobs.worker
    env_file: [.env]
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
