<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS Ecommerce OS</title>
<style>
:root{--bg:#0a0e17;--panel:#111826;--line:#1e2a3d;--cyan:#3fe9ff;--txt:#dce9f7;--muted:#7d93ad;
  --green:#41ffb0;--gold:#ffd166;--red:#ff5a7a;--orange:#ff9f43}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.brand{font-weight:800;letter-spacing:3px;color:var(--cyan)}
.brand small{color:var(--muted);letter-spacing:1px;font-weight:600;margin-left:8px;font-size:12px}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{margin:0 0 4px;font-size:15px}
.dom{color:var(--muted);font-size:12px;word-break:break-all}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;margin-top:8px;
  border:1px solid var(--line)}
.badge.AVAILABLE{color:var(--green);border-color:rgba(65,255,176,.4)}
.badge.AUTH_REQUIRED,.badge.UNAVAILABLE{color:var(--gold);border-color:rgba(255,209,102,.4)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px}
button{background:linear-gradient(135deg,#2b6bff,#0aa6c4);border:none;color:#fff;border-radius:10px;
  padding:9px 14px;font-weight:700;cursor:pointer;font-size:13px}
button:disabled{opacity:.5;cursor:default}
.result{margin-top:22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{display:block;font-size:24px}
.kpi span{color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:1px}
.risk{font-weight:700}.risk.CRITICAL,.risk.HIGH{color:var(--red)}.risk.MEDIUM{color:var(--orange)}
.risk.LOW{color:var(--green)}
.find{color:var(--muted);font-size:12px}
.tag{display:inline-block;background:#0e1a2c;border:1px solid var(--line);border-radius:6px;
  padding:1px 6px;margin:1px 2px;font-size:11px;color:var(--gold)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:18px;
  color:var(--muted);margin-top:14px}
.spin{color:var(--cyan)}
a{color:var(--cyan)}
</style>
</head>
<body>
<header>
  <span class="brand">JARVIS<small>ECOMMERCE OS · analyse boutiques temps réel</small></span>
</header>
<div class="wrap">
  <h2>Tes boutiques</h2>
  <div id="stores" class="stores"><div class="spin">Chargement…</div></div>
  <div id="result" class="result"></div>
</div>

<script>
const $ = s => document.querySelector(s);
async function api(p, opt){ const r = await fetch(p, opt); return r.json(); }

function badge(s){ return `<span class="badge ${s}">${s}</span>`; }

async function loadStores(){
  const j = await api('/stores');
  const el = $('#stores');
  if(!j.stores || !j.stores.length){
    el.innerHTML = `<div class="empty">Aucune boutique connectée.<br>Ajoute la variable Railway
      <b>SHOPIFY_STORES</b> = <code>[{"name":"Kim","domain":"xxxx.myshopify.com","token":"shpat_...","category":"reborn_doll"}]</code>
      puis recharge.</div>`;
    return;
  }
  el.innerHTML = j.stores.map(s => `
    <div class="card">
      <h3>${s.name}</h3>
      <div class="dom">${s.domain||''}</div>
      ${badge(s.status)}
      <div class="row"><span>Produits</span><b>${s.products??'—'}</b></div>
      <div class="row" style="margin-top:12px">
        <button ${s.status!=='AVAILABLE'?'disabled':''} onclick='audit(${JSON.stringify(s.name)})'>
          Analyser en direct</button>
      </div>
    </div>`).join('');
}

async function audit(name){
  const res = $('#result');
  res.innerHTML = `<div class="spin">Analyse de « ${name} » en cours…</div>`;
  const a = await api('/stores/'+encodeURIComponent(name)+'/audit?limit=50', {method:'POST'});
  if(a.status && a.status!=='ok'){
    res.innerHTML = `<div class="empty">Impossible d'analyser : ${a.error||a.status}</div>`;
    return;
  }
  const rows = (a.top_risks||[]).map(p => `
    <tr>
      <td>${p.title||p.product_id}</td>
      <td class="risk ${p.dispute_risk}">${p.dispute_risk}<br><span class="find">${p.dispute_score}/100</span></td>
      <td>${p.claim_quality}/100</td>
      <td>
        ${(p.internal_conflicts||[]).map(x=>`<span class="tag">conflit: ${x}</span>`).join('')}
        ${(p.unverified_claims||[]).map(x=>`<span class="tag">non étayé: ${x}</span>`).join('')}
        ${(p.missing_critical||[]).map(x=>`<span class="tag">manquant: ${x}</span>`).join('')}
        <div class="find">${(p.findings||[]).slice(0,2).join(' ')}</div>
      </td>
    </tr>`).join('');
  res.innerHTML = `
    <h2>Audit — ${a.store} <span class="find">(${a.domain||''})</span></h2>
    <div class="kpis">
      <div class="kpi"><b>${a.analyzed}</b><span>produits analysés</span></div>
      <div class="kpi"><b style="color:var(--red)">${a.high_risk}</b><span>risque de litige élevé</span></div>
      <div class="kpi"><b style="color:var(--orange)">${a.medium_risk}</b><span>risque moyen</span></div>
      <div class="kpi"><b>${a.avg_claim_quality}/100</b><span>qualité des revendications</span></div>
    </div>
    <p class="find">${a.summary||''}</p>
    <table>
      <thead><tr><th>Produit</th><th>Risque litige</th><th>Qualité</th><th>Problèmes détectés</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="4" class="find">Aucun risque notable 🎉</td></tr>'}</tbody>
    </table>
    <p class="find">Note : cet audit couvre la cohérence et la solidité des fiches (risque de litige)
    à partir des données Shopify en direct. La vérité complète vs fournisseur s'ajoute dès qu'une
    preuve fournisseur est fournie.</p>`;
}
loadStores();
</script>
</body>
</html>
